name: publish

# 发布到 npm，走 Trusted Publishing (OIDC) —— 不需要任何长期 token。
#
# 为什么必须用 OIDC 而不是 `npm publish` 本地执行：
# npm 的 2FA 只支持 WebAuthn 安全密钥，没有 6 位验证码；而 CLI 的交互式
# 认证要求 stdin/stdout 是 TTY（npm/lib/utils/auth.js:10-12），在脚本里
# 直接 throw。OIDC 把「证明我是我」这件事交给 GitHub 的 id-token，
# registry 验签后放行，绕开这道坎。
#
# 为什么 runs-on 必须写 windows-latest 而不是 ubuntu-latest：
# lib/index.js 里的 ABS_PATH_RE = /[A-Za-z]:\\[^\s"';|)]+/g 只认盘符路径，
# test/offline.mjs 有一批断言用它抽 shell 命令里的绝对路径。在 Linux 上
# 这些断言拿到的永远是空数组，会直接 fail。这不是「顺手选个平台」，
# 是这个仓库的测试本身带着 Windows 假设。

on:
  # 手动触发：首次发布与排障用这个，不依赖打 tag。
  workflow_dispatch:

  # 打 tag 自动发：以后 version 升完、推 v* tag 就走这条路。
  push:
    tags: ['v*']

jobs:
  # 先跑测试。测试不过就不该占用版本号 —— npm 的版本一旦发布不可撤回
  # （unpublish 会触发 24 小时封禁），发错了只能升版本补救。
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # 仓库里只有 pnpm-lock.yaml，没有 package-lock.json。
          # setup-node 自动开启的包管理器缓存找不到 npm 的 lockfile 会直接失败。
          package-manager-cache: false

      # 不用 `npm ci`：它强制要求 package-lock.json 存在，而本仓库用 pnpm。
      - run: npm install --no-audit --no-fund

      - run: npm test

  publish:
    needs: test
    runs-on: windows-latest
    # id-token 写在 job 级而不是顶层：只让真正发布的那一步拿到 OIDC 令牌，
    # test job 不需要这个权限，给了反而是多余的暴露面。
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # registry-url 会顺手往 .npmrc 写一行 `_authToken=${NODE_AUTH_TOKEN}`。
          # 不设 NODE_AUTH_TOKEN 时它是个空壳，npm 会当成「有凭据」而跳过
          # ENEEDAUTH 检查，带着空 token 去 PUT —— registry 回 404 而不是 401，
          # 报错信息完全指错方向。所以这里不写 registry-url，改用下面的
          # `--registry` 参数，让 npm 走纯 OIDC 路径。
          package-manager-cache: false

      # 排查用：OIDC 的两个环境变量是否注入（只在 id-token: write 时才有）。
      # 值不打印，只打印长度与 URL 的 host，避免泄露。
      - name: 检查 OIDC 环境变量
        shell: pwsh
        run: |
          $u = $env:ACTIONS_ID_TOKEN_REQUEST_URL
          $t = $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
          if ([string]::IsNullOrEmpty($u)) {
            Write-Output "ACTIONS_ID_TOKEN_REQUEST_URL: 未设置"
          } else {
            Write-Output "ACTIONS_ID_TOKEN_REQUEST_URL: 已设置，host=$(([uri]$u).Host)"
          }
          if ([string]::IsNullOrEmpty($t)) {
            Write-Output "ACTIONS_ID_TOKEN_REQUEST_TOKEN: 未设置"
          } else {
            Write-Output "ACTIONS_ID_TOKEN_REQUEST_TOKEN: 已设置，长度=$($t.Length)"
          }

      # 排查用：手动复刻 npm 的 OIDC token exchange，把 registry 的真实回应打出来。
      # npm 的 oidc() 从不抛错（lib/utils/oidc.js 外层 catch 吞掉一切），失败时
      # 只会静默退回匿名请求，报错指向别处（404 而不是「未配置 trusted publisher」）。
      # 这里直接问 registry，就能知道到底是不是连接没建好。
      - name: 手动验证 OIDC token exchange
        shell: pwsh
        run: |
          $u = $env:ACTIONS_ID_TOKEN_REQUEST_URL
          $t = $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
          if ([string]::IsNullOrEmpty($u) -or [string]::IsNullOrEmpty($t)) {
            Write-Output "跳过：OIDC 环境变量缺失"
            exit 0
          }
          # 第一步：向 GitHub 换 id_token
          $idResp = Invoke-RestMethod -Uri "$u&audience=npm:registry.npmjs.org" `
            -Headers @{ Authorization = "Bearer $t"; Accept = 'application/json' }
          $idToken = $idResp.value
          if ([string]::IsNullOrEmpty($idToken)) {
            Write-Output "GitHub 未返回 id_token"
            exit 0
          }
          Write-Output "GitHub id_token 已获取，长度=$($idToken.Length)"
          # 第二步：拿 id_token 向 registry 换 npm token（npm 自己调的那个端点）
          # 对照三个包，区分 404 的两种含义：
          #   dsh-annals  —— 已建 trusted publisher，但只有 stub 版本
          #   npm         —— 肯定存在但没配 trusted publisher（应报 unauthorized）
          #   zzz-no-such —— 根本不存在（若与上面同样报 not found，说明 404 是
          #                  「查无此包」，即 registry 不认 dsh-annals 存在）
          foreach ($pkg in @('dsh-annals', 'npm', 'zzz-no-such-pkg-9f8a7b')) {
            try {
              $exResp = Invoke-WebRequest `
                -Uri "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg" `
                -Method POST -Headers @{ Authorization = "Bearer $idToken" } `
                -UseBasicParsing -SkipHttpErrorCheck
              $body = $exResp.Content
              if ($body.Length -gt 400) { $body = $body.Substring(0, 400) }
              Write-Output "[$pkg] 状态码=$($exResp.StatusCode) 响应=$body"
            } catch {
              Write-Output "[$pkg] 抛错: $($_.Exception.Message)"
            }
          }

          # 第三步：确认 dsh-annals 在 registry 上有哪些版本、dist-tags 指向谁
          try {
            $meta = Invoke-RestMethod -Uri "https://registry.npmjs.org/dsh-annals" -TimeoutSec 20
            $vers = ($meta.versions.PSObject.Properties.Name) -join ', '
            $tags = $meta.'dist-tags' | ConvertTo-Json -Compress
            Write-Output "registry 上的 dsh-annals: versions=[$vers] dist-tags=$tags"
          } catch {
            Write-Output "读 dsh-annals 元数据失败: $($_.Exception.Message)"
          }

      # npm publish 之前不跑 build：本仓库没有构建步骤，lib/ 与 client/
      # 就是源码，files 白名单直接打进去。测试已在 test job 里跑过。

      # 显式带 --registry：runner 上虽然没有镜像源的干扰，但把目标写死
      # 一眼能看出「发到哪」。provenance 由 OIDC 自动生成，无需额外参数。
      # `--loglevel=verbose` 会把 oidc.js 里那几条 log.verbose 打出来，
      # 失败时能直接看到 token exchange 到底哪一步断的。
      - run: npm publish --registry https://registry.npmjs.org --loglevel=verbose
